<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Gedver</title>
    <style>
:root {
  color-scheme: light;
  --bg: #f5f7f9;
  --surface: #ffffff;
  --surface-muted: #eef2f5;
  --line: #c9d2db;
  --line-strong: #8793a0;
  --text: #1d2730;
  --muted: #617080;
  --accent: #0f766e;
  --danger: #b42318;
  --marker: #d7263d;
  --shadow: 0 1px 3px rgba(21, 33, 43, 0.18);
  font-family:
    Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
    sans-serif;
}

* {
  box-sizing: border-box;
}

html,
body {
  height: 100%;
  margin: 0;
}

body {
  background: var(--bg);
  color: var(--text);
  font-size: 14px;
  letter-spacing: 0;
  overflow: hidden;
}

button,
input,
select {
  font: inherit;
}

button,
.file-button {
  align-items: center;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 6px;
  color: var(--text);
  cursor: pointer;
  display: inline-flex;
  gap: 6px;
  min-height: 34px;
  padding: 6px 10px;
  white-space: nowrap;
}

button:hover,
.file-button:hover {
  border-color: var(--line-strong);
}

button:disabled {
  color: var(--muted);
  cursor: not-allowed;
  opacity: 0.7;
}

input,
select {
  background: #fff;
  border: 1px solid var(--line);
  border-radius: 6px;
  color: var(--text);
  min-height: 32px;
  padding: 5px 8px;
  width: 100%;
}

input[type="checkbox"],
input[type="radio"] {
  min-height: auto;
  width: auto;
}

input[type="file"] {
  display: none;
}

.app-bar {
  align-items: center;
  background: var(--surface);
  border-bottom: 1px solid var(--line);
  display: flex;
  gap: 16px;
  height: 58px;
  justify-content: space-between;
  padding: 10px 14px;
}

.brand {
  align-items: baseline;
  display: flex;
  gap: 10px;
  min-width: 0;
}

.brand h1 {
  font-size: 18px;
  font-weight: 700;
  margin: 0;
}

.status-line {
  color: var(--muted);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.top-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  justify-content: flex-end;
}

.app-shell {
  display: grid;
  grid-template-columns: minmax(260px, 320px) minmax(320px, 1fr) minmax(300px, 380px);
  height: calc(100% - 58px);
  min-height: 0;
}

.panel {
  background: var(--surface);
  min-height: 0;
  overflow: auto;
}

.panel-left {
  border-right: 1px solid var(--line);
}

.panel-right {
  border-left: 1px solid var(--line);
}

.panel-section {
  border-bottom: 1px solid var(--line);
  padding: 14px;
}

.panel-section h2 {
  font-size: 13px;
  font-weight: 700;
  margin: 0 0 10px;
  text-transform: uppercase;
}

.field {
  display: grid;
  gap: 6px;
  margin-bottom: 12px;
}

.field:last-child {
  margin-bottom: 0;
}

.field label,
.choice,
.subtle {
  color: var(--muted);
}

.choice {
  align-items: center;
  display: flex;
  gap: 8px;
  line-height: 1.25;
  margin: 8px 0;
}

.segmented {
  border: 1px solid var(--line);
  border-radius: 6px;
  display: grid;
  overflow: hidden;
}

.segmented label {
  align-items: center;
  border-bottom: 1px solid var(--line);
  color: var(--text);
  cursor: pointer;
  display: flex;
  gap: 8px;
  min-height: 34px;
  padding: 7px 9px;
}

.segmented label:last-child {
  border-bottom: 0;
}

.button-row {
  align-items: center;
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

.summary-grid {
  display: grid;
  gap: 8px;
  grid-template-columns: repeat(2, minmax(0, 1fr));
}

.color-legend {
  display: grid;
  gap: 7px;
  margin-top: 10px;
}

.color-legend-title {
  color: var(--text);
  font-size: 12px;
  font-weight: 700;
}

.color-legend-ramp {
  background: linear-gradient(90deg, #2563eb, #16a34a, #f59e0b, #dc2626);
  border: 1px solid var(--line);
  border-radius: 6px;
  height: 12px;
}

.color-legend-ramp.is-muted {
  filter: grayscale(1);
  opacity: 0.45;
}

.color-legend-scale {
  color: var(--muted);
  display: flex;
  font-size: 12px;
  justify-content: space-between;
  gap: 12px;
}

.metric {
  background: var(--surface-muted);
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 8px;
}

.metric strong {
  display: block;
  font-size: 18px;
}

.summary-breakdown {
  font-size: 12px;
  line-height: 1.35;
  margin-top: 8px;
}

.map-panel {
  background: #cfe3ee;
  min-height: 0;
  position: relative;
}

.map-toolbar {
  align-items: center;
  display: flex;
  gap: 8px;
  left: 12px;
  position: absolute;
  top: 12px;
  z-index: 20;
}

.map-toolbar button {
  box-shadow: var(--shadow);
  height: 36px;
  justify-content: center;
  min-width: 36px;
  padding: 0;
}

.map-viewport {
  height: 100%;
  outline: none;
  overflow: hidden;
  position: relative;
  touch-action: none;
  user-select: none;
  width: 100%;
}

.offline-layer,
.marker-layer {
  inset: 0;
  position: absolute;
}

.offline-layer {
  background:
    linear-gradient(180deg, rgba(255, 255, 255, 0.2), rgba(255, 255, 255, 0)),
    #cfe3ee;
  z-index: 0;
}

.map-land {
  fill: #d8e4cb;
  fill-rule: evenodd;
  stroke: #8ca57e;
  stroke-width: 1;
}

.map-border {
  fill: none;
  stroke: #9fae99;
  stroke-linejoin: round;
  stroke-width: 0.75;
}

.map-detail-land {
  fill: #dce8d0;
  fill-rule: evenodd;
  stroke: #6f8a69;
  stroke-linejoin: round;
  stroke-width: 0.9;
}

.map-detail-border {
  fill: none;
  stroke: #5f765d;
  stroke-linejoin: round;
  stroke-width: 0.85;
}

.map-detail-water {
  fill: #b9dceb;
  fill-rule: evenodd;
  stroke: #7eb2c9;
  stroke-linejoin: round;
  stroke-width: 0.8;
}

.map-province-border {
  fill: none;
  stroke: #4d6857;
  stroke-dasharray: 3 2;
  stroke-linejoin: round;
  stroke-width: 0.7;
}

.map-grid {
  stroke: #8fb1c2;
  stroke-width: 1;
  opacity: 0.48;
}

.map-label {
  fill: #496473;
  font-size: 11px;
}

.map-city-dot {
  fill: #415b50;
  opacity: 0.86;
  stroke: rgba(255, 255, 255, 0.85);
  stroke-width: 1;
}

.map-city-label {
  fill: #33485f;
  font-size: 12px;
  font-weight: 600;
  paint-order: stroke;
  stroke: rgba(255, 255, 255, 0.86);
  stroke-linejoin: round;
  stroke-width: 3.5px;
}

.marker-layer {
  overflow: visible;
  pointer-events: none;
  z-index: 10;
}

.marker {
  cursor: pointer;
  pointer-events: auto;
}

.marker circle {
  filter: drop-shadow(0 2px 3px rgba(20, 30, 40, 0.35));
  stroke: #fff;
  stroke-width: 3;
}

.marker text {
  dominant-baseline: central;
  fill: #fff;
  font-size: 12px;
  font-weight: 800;
  pointer-events: none;
  text-anchor: middle;
}

.marker.is-selected circle {
  stroke: #111827;
  stroke-width: 4;
}

.map-empty,
.map-attribution {
  background: rgba(255, 255, 255, 0.88);
  border: 1px solid var(--line);
  border-radius: 6px;
  color: var(--muted);
  padding: 6px 8px;
  position: absolute;
  z-index: 15;
}

.map-empty {
  left: 50%;
  max-width: 320px;
  text-align: center;
  top: 50%;
  transform: translate(-50%, -50%);
}

.map-attribution {
  bottom: 8px;
  font-size: 12px;
  right: 8px;
}

.map-attribution a {
  color: #1f4f8f;
}

.event-list {
  display: grid;
  gap: 8px;
}

.event-row {
  border: 1px solid var(--line);
  border-radius: 6px;
  display: grid;
  gap: 4px;
  padding: 8px;
}

.event-row strong {
  font-size: 14px;
}

.event-meta {
  color: var(--muted);
  display: grid;
  gap: 2px;
}

.place-list {
  display: grid;
  gap: 8px;
}

.place-row {
  border: 1px solid var(--line);
  border-radius: 6px;
  display: grid;
  gap: 8px;
  padding: 8px;
}

.place-row header {
  align-items: start;
  display: flex;
  gap: 8px;
  justify-content: space-between;
}

.place-row header button {
  min-height: 28px;
  padding: 3px 7px;
}

.coordinate-grid {
  display: grid;
  gap: 6px;
  grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) auto;
}

.coordinate-grid input {
  min-width: 0;
}

.coordinate-grid button {
  min-height: 32px;
  padding: 5px 8px;
}

.badge {
  background: var(--surface-muted);
  border: 1px solid var(--line);
  border-radius: 999px;
  color: var(--muted);
  display: inline-flex;
  font-size: 12px;
  padding: 2px 7px;
  white-space: nowrap;
}

.notice {
  background: #fff7ed;
  border: 1px solid #fed7aa;
  border-radius: 6px;
  color: #7c2d12;
  font-size: 12px;
  line-height: 1.35;
  padding: 7px 8px;
}

.danger {
  color: var(--danger);
}

.hidden {
  display: none !important;
}

@media (max-width: 1000px) {
  body {
    overflow: auto;
  }

  .app-bar {
    align-items: stretch;
    height: auto;
  }

  .app-shell {
    grid-template-columns: 1fr;
    height: auto;
  }

  .panel-left,
  .panel-right {
    border: 0;
  }

  .map-panel {
    height: 62vh;
    min-height: 420px;
  }
}

@media (max-width: 640px) {
  .app-bar {
    flex-direction: column;
  }

  .brand {
    flex-direction: column;
    gap: 3px;
  }

  .top-actions {
    justify-content: flex-start;
  }

  .coordinate-grid {
    grid-template-columns: 1fr 1fr;
  }

  .coordinate-grid button {
    grid-column: 1 / -1;
  }
}

#selectedCoordinates { margin-top: 12px; }
.coordinate-grid { align-items: end; }
.coordinate-grid label { color: var(--muted); font-size: 12px; }
    </style>

  <body>
    <header class="app-bar">
      <div class="brand">
        <h1>Gedver</h1>
        <div id="statusLine" class="status-line">No GEDCOM loaded</div>
      </div>
      <div class="top-actions">
        <label class="file-button" for="gedcomFile">Open GEDCOM</label>
        <input id="gedcomFile" type="file" accept=".ged,.gedcom,text/plain" />
        <label class="file-button" for="locationFile">Import coordinates</label>
        <input id="locationFile" type="file" accept=".json,.csv,text/csv,application/json,text/plain" />
        <button id="exportLocations" type="button">Export coordinates</button>
      </div>
    </header>

    <main class="app-shell">
      <aside class="panel panel-left" aria-label="Controls">
        <section class="panel-section">
          <h2>Tree</h2>
          <div class="field">
            <label for="probandSelect">Proband</label>
            <select id="probandSelect" disabled>
              <option value="">Load a GEDCOM</option>
            </select>
          </div>
          <label class="choice">
            <input id="ancestryOnly" type="checkbox" checked />
            <span>Only proband ancestry</span>
          </label>
        </section>

        <section class="panel-section">
          <h2>Events</h2>
          <label class="choice">
            <input id="filterBirth" type="checkbox" checked />
            <span>Birth</span>
          </label>
          <label class="choice">
            <input id="filterMarriage" type="checkbox" checked />
            <span>Marriage</span>
          </label>
          <label class="choice">
            <input id="filterDeath" type="checkbox" checked />
            <span>Death</span>
          </label>
        </section>

        <section class="panel-section">
          <h2>Color</h2>
          <div class="segmented" role="radiogroup" aria-label="Marker color mode">
            <label>
              <input type="radio" name="colorMode" value="single" checked />
              <span>Single color</span>
            </label>
            <label>
              <input type="radio" name="colorMode" value="time" />
              <span>Time gradient</span>
            </label>
            <label>
              <input type="radio" name="colorMode" value="lineageX" />
              <span>Lineage position</span>
            </label>
            <label>
              <input type="radio" name="colorMode" value="lineageDepth" />
              <span>Generation depth</span>
            </label>
          </div>
          <div id="colorLegend" class="color-legend hidden" aria-live="polite">
            <div id="colorLegendTitle" class="color-legend-title"></div>
            <div id="colorLegendRamp" class="color-legend-ramp"></div>
            <div class="color-legend-scale">
              <span id="colorLegendMin"></span>
              <span id="colorLegendMax"></span>
            </div>
            <div id="colorLegendNote" class="subtle"></div>
          </div>
        </section>

        <section class="panel-section">
          <h2>Summary</h2>
          <div class="summary-grid">
            <div class="metric"><span class="subtle">People</span><strong id="peopleCount">0</strong></div>
            <div class="metric"><span class="subtle">Events</span><strong id="eventCount">0</strong></div>
            <div class="metric"><span class="subtle">Mapped</span><strong id="mappedCount">0</strong></div>
            <div class="metric"><span class="subtle">Unmapped</span><strong id="unmappedCount">0</strong></div>
          </div>
          <div id="eventBreakdown" class="summary-breakdown subtle"></div>
          <div id="missingLocationNotice" class="notice hidden"></div>
        </section>

        <section class="panel-section">
          <h2>Coordinates</h2>
          <div class="button-row">
            <button id="showUnmapped" type="button">Unmapped</button>
            <button id="showMapped" type="button">Mapped</button>
            <button id="clearLocations" type="button">Clear saved</button>
          </div>
          <div id="placeList" class="place-list" aria-live="polite"></div>
        </section>
      </aside>

      <section class="map-panel" aria-label="Map">
        <div class="map-toolbar">
          <button id="zoomIn" type="button" title="Zoom in" aria-label="Zoom in">+</button>
          <button id="zoomOut" type="button" title="Zoom out" aria-label="Zoom out">−</button>
          <button id="fitMap" type="button" title="Fit markers" aria-label="Fit markers">⤢</button>
        </div>
        <div id="mapViewport" class="map-viewport" tabindex="0">
          <svg id="offlineLayer" class="offline-layer" aria-hidden="true"></svg>
          <svg id="markerLayer" class="marker-layer" aria-label="Location markers"></svg>
          <div id="mapEmpty" class="map-empty">No mapped events</div>
          <div class="map-attribution">Made with Natural Earth</div>
        </div>
      </section>

      <aside class="panel panel-right" aria-label="Selected location">
        <section class="panel-section">
          <h2>Location</h2>
          <h3 id="selectedPlaceTitle">No location selected</h3>
          <div id="selectedPlaceMeta" class="subtle">Click a marker on the map</div>
          <div id="selectedCoordinates"></div>
        </section>
        <section class="panel-section">
          <h2>Events at location</h2>
          <div id="eventList" class="event-list"></div>
        </section>
      </aside>
    </main>

    const familiesAsSpouse = children(record, "FAMS").map((node) => normalizeXref(valueWithContinuations(node)));

    return {
      id,
      name,
      sex,
      familiesAsChild,
      familiesAsSpouse,
      birth: parseEventNode(firstChild(record, "BIRT")),
      death: parseEventNode(firstChild(record, "DEAT")),
    };
  }

  function parseFamilyRecord(record) {
    const id = normalizeXref(record.xref);
    return {
      id,
      husband: normalizeXref(firstChildValue(record, "HUSB")),
      wife: normalizeXref(firstChildValue(record, "WIFE")),
      children: children(record, "CHIL").map((node) => normalizeXref(valueWithContinuations(node))),
      marriage: parseEventNode(firstChild(record, "MARR")),
    };
  }

  function parseSubmitterRecord(record) {
    const id = normalizeXref(record.xref);
    const name = valueWithContinuations(firstChild(record, "NAME") || { value: "", children: [] });
    return {
      id,
      name: name.replace(/\s+/g, " ").trim(),
    };
  }

  function parseEventNode(node) {
    if (!node) return null;
    const dateRaw = firstChildValue(node, "DATE");
    const place = normalizePlace(firstChildValue(node, "PLAC"));
    return {
      dateRaw,
      date: parseGedcomDate(dateRaw),
      place,
    };
  }

  function parseName(rawName, node) {
    const raw = String(rawName || "").trim();
    if (!raw) {
      return {
        raw: "",
        given: "",
        surname: "",
        suffix: "",
        display: "(unnamed)",
      };
    }

    const slashMatch = raw.match(/^(.*?)\s+\/(.*)\/(.*)$/) || raw.match(/^(.*?)\/(.*)\/(.*)$/);
    if (!slashMatch) {
      return {
        raw,
        given: raw.replace(/\s+/g, " ").trim(),
        surname: "",
        suffix: "",
        display: raw.replace(/\//g, "").replace(/\s+/g, " ").trim(),
      };
    }

    const clean = (value) => value.replace(/\s*\/\s*/g, "/").replace(/\s+/g, " ").trim();
    const given = clean((node && firstChildValue(node, "GIVN")) || slashMatch[1]);
    const surname = clean((node && firstChildValue(node, "SURN")) || slashMatch[2]);
    const prefix = clean((node && firstChildValue(node, "SPFX")) || "");
    const fullSurname = prefix && !surname.toLowerCase().startsWith(prefix.toLowerCase() + " ") ? `${prefix} ${surname}` : surname;
    const suffix = clean(slashMatch[3]);
    const display = [given, fullSurname.toLocaleUpperCase(), suffix].filter(Boolean).join(" ").replace(/\s+/g, " ").trim();

    return {
      raw,
      given,
      surname,
      suffix,
      display: display || "(unnamed)",
    };
  }

  function firstChild(node, tag) {
    return node.children.find((child) => child.tag === tag) || null;
  }

  function children(node, tag) {
    return node.children.filter((child) => child.tag === tag);
  }

  function firstChildValue(node, tag) {
    const child = firstChild(node, tag);
    return child ? valueWithContinuations(child) : "";
  }

  function valueWithContinuations(node) {
    let value = node.value || "";
    for (const child of node.children) {
      if (child.tag === "CONC") value += child.value || "";
      if (child.tag === "CONT") value += "\n" + (child.value || "");
    }
    return value.trim();
  }

  function normalizeXref(value) {
    return String(value || "").trim().replace(/^@|@$/g, "");
  }

  function normalizePlace(value) {
    return String(value || "").replace(/\s+/g, " ").trim();
  }

  function parseGedcomDate(rawValue) {
    const original = String(rawValue || "").trim();
    if (!original) {
      return emptyDate(original);
    }

    const normalized = original
      .replace(/[,]/g, " ")
      .replace(/\s+/g, " ")
      .trim()
      .toUpperCase();

    let modifier = "";
    let startText = normalized;
    let endText = "";

    const between = normalized.match(/^BET\s+(.+?)\s+AND\s+(.+)$/);
    if (between) {
      modifier = "BET";
      startText = between[1];
      endText = between[2];
    } else {
      const fromTo = normalized.match(/^FROM\s+(.+?)\s+TO\s+(.+)$/);
      if (fromTo) {
        modifier = "FROM";
        startText = fromTo[1];
        endText = fromTo[2];
      } else {
        const from = normalized.match(/^FROM\s+(.+)$/);
        const to = normalized.match(/^TO\s+(.+)$/);
        const qualified = normalized.match(/^(ABT|ABOUT|AFT|AFTER|BEF|BEFORE|CAL|CALCULATED|EST|ESTIMATED|INT|INTERPRETED)\s+(.+)$/);
        if (from) {
          modifier = "FROM";
          startText = from[1];
        } else if (to) {
          modifier = "TO";
          startText = to[1];
        } else if (qualified) {
          modifier = qualified[1];
          startText = qualified[2];
        }
      }
    }

    const start = parseDatePart(startText);
    const end = endText ? parseDatePart(endText) : null;

    return {
      raw: original,
      modifier,
      start,
      end,
      comparable: start ? dateComparable(start) : null,
      display: start ? formatDatePart(start) : original,
      hasDate: Boolean(start),
    };
  }

  function emptyDate(original) {
    return {
      raw: original,
      modifier: "",
      start: null,
      end: null,
      comparable: null,
      display: "",
      hasDate: false,
    };
  }

  function parseDatePart(text) {
    const value = String(text || "")
      .replace(/[()]/g, "")
      .replace(/\s+/g, " ")
      .trim()
      .toUpperCase();
    if (!value) return null;

    let match = value.match(/^(\d{1,2})[-/.](\d{1,2})[-/.](\d{3,4})$/);
    if (match) {
      return makeDatePart(Number(match[3]), Number(match[2]), Number(match[1]));
    }

    match = value.match(/^(\d{3,4})[-/.](\d{1,2})[-/.](\d{1,2})$/);
    if (match) {
      return makeDatePart(Number(match[1]), Number(match[2]), Number(match[3]));
    }

    const tokens = value.split(" ");
    if (tokens.length === 3 && /^\d{1,2}$/.test(tokens[0]) && MONTHS[tokens[1]] && /^\d{3,4}$/.test(tokens[2])) {
      return makeDatePart(Number(tokens[2]), MONTHS[tokens[1]], Number(tokens[0]));
    }

    if (tokens.length === 2 && MONTHS[tokens[0]] && /^\d{3,4}$/.test(tokens[1])) {
      return makeDatePart(Number(tokens[1]), MONTHS[tokens[0]], null);
    }

    if (/^\d{3,4}$/.test(value)) {
      return makeDatePart(Number(value), null, null);
    }

    return null;

  function makeDatePart(year, month, day) {
    if (!Number.isFinite(year) || year < 1) return null;
    const safeMonth = month == null ? null : clamp(Math.trunc(month), 1, 12);
    const safeDay = day == null ? null : clamp(Math.trunc(day), 1, 31);
    return {
      year: Math.trunc(year),
      month: safeMonth,
      day: safeDay,
      precision: safeDay ? "day" : safeMonth ? "month" : "year",
    };
  }

  function dateComparable(part) {
    return part.year * 372 + (part.month || 1) * 31 + (part.day || 1);
  }

  function formatDatePart(part) {
    if (part.month == null) return String(part.year).padStart(4, "0");
    if (part.day == null) return `${String(part.month).padStart(2, "0")}-${String(part.year).padStart(4, "0")}`;
    const day = part.day == null ? "??" : String(part.day).padStart(2, "0");
    const month = part.month == null ? "??" : String(part.month).padStart(2, "0");
    return `${day}-${month}-${String(part.year).padStart(4, "0")}`;
  }

  function computeAncestry(data, probandId) {
    const result = new Map();
    const cleanProbandId = normalizeXref(probandId);
    if (!cleanProbandId || !data.individuals.has(cleanProbandId)) {
      return result;
    }

    const queue = [{ id: cleanProbandId, depth: 0, pathIndex: 0, path: [] }];
    const seenStates = new Set();

    while (queue.length) {
      const state = queue.shift();
      const stateKey = `${state.id}|${state.depth}|${state.pathIndex}`;
      if (seenStates.has(stateKey)) continue;
      seenStates.add(stateKey);

      const x = lineageXForPath(state.depth, state.pathIndex);
      const current = result.get(state.id);
      if (!current || state.depth < current.depth) {
        result.set(state.id, { depth: state.depth, positions: [x], relations: [relationLabelForPath(state.path)] });
      } else if (current.depth === state.depth && !current.positions.includes(x)) {
        current.positions.push(x);
      }
      const updated = result.get(state.id);
      const relation = relationLabelForPath(state.path);
      if (updated && state.depth === updated.depth && relation && !updated.relations.includes(relation)) {
        updated.relations.push(relation);
      }

      const parents = getParents(data, state.id);
      if (parents.father) {
        queue.push({ id: parents.father, depth: state.depth + 1, pathIndex: state.pathIndex * 2, path: [...state.path, "father"] });
      }
      if (parents.mother) {
        queue.push({ id: parents.mother, depth: state.depth + 1, pathIndex: state.pathIndex * 2 + 1, path: [...state.path, "mother"] });
      }
    }

    for (const value of result.values()) {
      value.x = average(value.positions);
    }

    return result;
  }

  function relationLabelForPath(path) {
    if (!path || !path.length) return "proband";
    const depth = path.length;
    const first = path[0];
    const last = path[path.length - 1];
    const side = first === "father" ? "paternal" : first === "mother" ? "maternal" : "";
    const gendered = last === "father" ? "father" : last === "mother" ? "mother" : "parent";

    if (depth === 1) return gendered;

    const grandRelation = gendered === "father" ? "grandfather" : gendered === "mother" ? "grandmother" : "grandparent";
    if (depth === 2) return [side, grandRelation].filter(Boolean).join(" ");

    const greatPrefix = Array(depth - 2).fill("great").join("-");
    return [side, `${greatPrefix}-${grandRelation}`].filter(Boolean).join(" ");
  }

  function lineageXForPath(depth, pathIndex) {
    if (depth <= 0) return 0.5;
    const denominator = Math.pow(2, depth) - 1;
    return denominator <= 0 ? 0.5 : pathIndex / denominator;
  }

  function getParents(data, childId) {
    const individual = data.individuals.get(childId);
    const familyIds = new Set(individual ? individual.familiesAsChild : []);
    for (const familyId of data.childToFamilies.get(childId) || []) {
      familyIds.add(familyId);
    }

    for (const familyId of familyIds) {
      const family = data.families.get(familyId);
      if (!family) continue;
      return { father: family.husband, mother: family.wife, familyId };
    }

    return { father: "", mother: "", familyId: "" };
  }

  function extractEvents(data, options) {
    const settings = {
      birth: true,
      marriage: true,
      death: true,
      ancestryOnly: false,
      probandId: "",
      ...options,
    };
    const ancestry = settings.probandId ? computeAncestry(data, settings.probandId) : new Map();
    const useAncestryFilter = Boolean(settings.ancestryOnly && ancestry.size);
    const events = [];

    for (const individual of data.individuals.values()) {
      const included = !useAncestryFilter || ancestry.has(individual.id);
      if (!included) continue;

      if (settings.birth && eventHasPlace(individual.birth)) {
        events.push(makeIndividualEvent("birth", individual, individual.birth, ancestry));
      }
      if (settings.death && eventHasPlace(individual.death)) {
        events.push(makeIndividualEvent("death", individual, individual.death, ancestry));
      }
    }

    for (const family of data.families.values()) {
      if (!settings.marriage || !eventHasPlace(family.marriage)) continue;
      const participantIds = [family.husband, family.wife].filter(Boolean);
      const included = !useAncestryFilter || participantIds.some((id) => ancestry.has(id));
      if (!included) continue;

  }

  function eventHasPlace(event) {
    return Boolean(event && event.place);
  }

  function makeIndividualEvent(type, individual, event, ancestry) {
    const metric = lineageMetric([individual.id], ancestry);
    return {
      id: `${type}:${individual.id}`,
      type,
      label: EVENT_LABELS[type],
      personId: individual.id,
      familyId: "",
      people: [individual.id],
      name: individual.name.display,
      date: event.date,
      dateLabel: event.date.display,
      place: event.place,
      lineageX: metric.x,
      lineageDepth: metric.depth,
      relation: relationForIds([individual.id], ancestry),
    };
  }

  function makeFamilyEvent(type, family, data, event, ancestry) {
    const people = [family.husband, family.wife].filter(Boolean);
    const names = people.map((id) => {
      const individual = data.individuals.get(id);
      return individual && individual.name ? individual.name.display : "(unnamed)";
    });
    const metric = lineageMetric(people, ancestry);
    return {
      id: `${type}:${family.id}`,
      type,
      label: EVENT_LABELS[type],
      personId: "",
      familyId: family.id,
      people,
      name: names.join(" + ") || "(unnamed)",
      date: event.date,
      dateLabel: event.date.display,
      place: event.place,
      lineageX: metric.x,
      lineageDepth: metric.depth,
      relation: relationForIds(people, ancestry),
    };
  }

  function relationForIds(ids, ancestry) {
    const labels = ids
      .map((id) => ancestry.get(id))
      .filter(Boolean)
      .flatMap((metric) => metric.relations || [])
      .filter(Boolean);
    return unique(labels).join(" + ");
  }

  function unique(values) {
    return Array.from(new Set(values));
  }

  function lineageMetric(ids, ancestry) {
    const metrics = ids.map((id) => ancestry.get(id)).filter(Boolean);
    if (!metrics.length) return { x: null, depth: null };
    const newestDepth = Math.min(...metrics.map((metric) => metric.depth));
    const newest = metrics.filter((metric) => metric.depth === newestDepth);
    return {
      depth: newestDepth,
      x: average(newest.map((metric) => metric.x)),
    };
  }

  function groupEventsByLocation(events, locations) {
    const groups = new Map();
    for (const event of events) {
      const place = normalizePlace(event.place);
      if (!place) continue;
      if (!groups.has(place)) {
        groups.set(place, {
          place,
          events: [],
          coordinates: findCoordinates(place, locations),
          colorValue: null,
        });
      }
      groups.get(place).events.push(event);
    }
    return Array.from(groups.values()).sort((a, b) => a.place.localeCompare(b.place));
  }

  function findCoordinates(place, locations) {
    const table = locations || {};
    const exact = table[place];
    if (isCoordinate(exact)) return exact;
    const lower = place.toLocaleLowerCase();
    const matchingKey = Object.keys(table).find((key) => key.toLocaleLowerCase() === lower);
    return isCoordinate(table[matchingKey]) ? table[matchingKey] : null;
  }

  function isCoordinate(value) {
    return (
      value &&
      Number.isFinite(Number(value.lat)) &&
      Number.isFinite(Number(value.lng)) &&
      Number(value.lat) >= -90 &&
      Number(value.lat) <= 90 &&
      Number(value.lng) >= -180 &&
      Number(value.lng) <= 180
    );
  }

  function groupRepresentativeEvent(group) {
    const dated = group.events
      .filter((event) => event.date && event.date.comparable != null)
      .sort((a, b) => b.date.comparable - a.date.comparable);
    return dated[0] || group.events[0] || null;
  }

  function colorForGroup(group, mode, context) {
    if (mode === "single") return context.singleColor || "#d11f1f";
    const value = colorValueForGroup(group, mode);
    if (value == null) return interpolatePalette(context.palette, 0.5);

    if (mode === "time") {
      return interpolatePalette(context.palette, normalizeBetween(value, context.minDate, context.maxDate));
    }

    if (mode === "lineageX") {
      return interpolatePalette(context.palette, value);
    }

    if (mode === "lineageDepth") {
      return interpolatePalette(context.palette, normalizeBetween(value, context.minDepth, context.maxDepth));
    }

    return context.singleColor || "#d11f1f";
  }

  function colorValueForGroup(group, mode) {
    if (!group || !Array.isArray(group.events)) return null;
    if (mode === "time") {
      const event = groupRepresentativeEvent(group);
      return event && event.date && Number.isFinite(event.date.comparable) ? event.date.comparable : null;
    }
    if (mode === "lineageX") {
      return average(group.events.map((event) => event.lineageX));
    }
    if (mode === "lineageDepth") {
      return average(group.events.map((event) => event.lineageDepth));
    }
    return null;
  }

  function colorContext(events, singleColor) {
    const datedEvents = events
      .filter((event) => event.date && event.date.comparable != null)
      .sort((a, b) => a.date.comparable - b.date.comparable);
    const dates = datedEvents.map((event) => event.date.comparable);
    const lineageXs = events.map((event) => event.lineageX).filter((value) => value != null);
    const depths = events.map((event) => event.lineageDepth).filter((value) => value != null);
    return {
      singleColor,
      totalEvents: events.length,
      dateCount: dates.length,
      lineageXCount: lineageXs.length,
      lineageDepthCount: depths.length,
      minDate: dates.length ? Math.min(...dates) : 0,
      maxDate: dates.length ? Math.max(...dates) : 1,
      minDateLabel: datedEvents.length ? datedEvents[0].date.display : "",
      maxDateLabel: datedEvents.length ? datedEvents[datedEvents.length - 1].date.display : "",
      minLineageX: lineageXs.length ? Math.min(...lineageXs) : null,
      maxLineageX: lineageXs.length ? Math.max(...lineageXs) : null,
      minDepth: depths.length ? Math.min(...depths) : 0,
      maxDepth: depths.length ? Math.max(...depths) : 1,
      palette: ["#2563eb", "#16a34a", "#f59e0b", "#dc2626"],
    };
  }

  function normalizeBetween(value, min, max) {
    if (value == null || !Number.isFinite(value)) return 0.5;
    if (min == null || max == null || min === max) return 0.5;
    return clamp((value - min) / (max - min), 0, 1);
  }

  function interpolatePalette(palette, value) {
    const colors = palette && palette.length ? palette : ["#2563eb", "#dc2626"];
    const t = clamp(value, 0, 1);
    if (colors.length === 1) return colors[0];
    const scaled = t * (colors.length - 1);
    const index = Math.min(colors.length - 2, Math.floor(scaled));
    const localT = scaled - index;
    return interpolateColor(colors[index], colors[index + 1], localT);
  }

  function interpolateColor(start, end, amount) {
    const a = hexToRgb(start);
    const b = hexToRgb(end);
    const t = clamp(amount, 0, 1);
    return rgbToHex({
      r: Math.round(a.r + (b.r - a.r) * t),
      g: Math.round(a.g + (b.g - a.g) * t),
      b: Math.round(a.b + (b.b - a.b) * t),
    });
  }

  function hexToRgb(hex) {
    const clean = String(hex || "").replace("#", "");
    const full = clean.length === 3 ? clean.replace(/(.)/g, "$1$1") : clean;
    const value = Number.parseInt(full || "000000", 16);
    return {
      r: (value >> 16) & 255,
      g: (value >> 8) & 255,
      b: value & 255,
    };
  }

  function rgbToHex(rgb) {
    return `#${[rgb.r, rgb.g, rgb.b].map((part) => clamp(part, 0, 255).toString(16).padStart(2, "0")).join("")}`;
  }

  function average(values) {
    const usable = values.filter((value) => Number.isFinite(value));
    if (!usable.length) return null;
    return usable.reduce((sum, value) => sum + value, 0) / usable.length;
  }

  function clamp(value, min, max) {
    return Math.min(max, Math.max(min, value));
  }

  return {
    EVENT_LABELS,
    parseGedcom,
    parseGedcomDate,
    computeAncestry,
    extractEvents,
    groupEventsByLocation,
    groupRepresentativeEvent,
    colorContext,
    colorForGroup,
    colorValueForGroup,
    interpolateColor,
    normalizePlace,
  };
});

      renderPlaceList();
    });
    el.clearLocations.addEventListener("click", clearLocations);
    el.zoomIn.addEventListener("click", () => zoomBy(1));
    el.zoomOut.addEventListener("click", () => zoomBy(-1));
    el.fitMap.addEventListener("click", fitToMarkers);

    el.mapViewport.addEventListener("pointerdown", onPointerDown);
    el.mapViewport.addEventListener("pointermove", onPointerMove);
    el.mapViewport.addEventListener("pointerup", onPointerUp);
    el.mapViewport.addEventListener("pointercancel", onPointerUp);
    el.mapViewport.addEventListener("wheel", onWheel, { passive: false });
    window.addEventListener("resize", debounce(() => renderMap(), 100));

    renderAll();
  }

  function onGedcomFile(event) {
    const file = event.target.files && event.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        state.data = Core.parseGedcom(String(reader.result || ""));
        state.fileName = file.name;
        state.selectedPlace = "";
        populateProbandSelect();
        recalculate(true);
      } catch (error) {
        showStatus(`Could not read ${file.name}: ${error.message}`);
      }
    };
    reader.onerror = () => showStatus(`Could not read ${file.name}`);
    reader.readAsText(file, "UTF-8");
  }

  function onLocationFile(event) {
    const file = event.target.files && event.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const imported = parseLocationImport(String(reader.result || ""), file.name);
        state.locations = { ...state.locations, ...imported };
        saveStoredLocations(state.locations);
        recalculate(true);
        showStatus(`Imported ${Object.keys(imported).length} coordinate rows from ${file.name}`);
      } catch (error) {
        showStatus(`Could not import ${file.name}: ${error.message}`);
      } finally {
        el.locationFile.value = "";
      }
    };
    reader.onerror = () => showStatus(`Could not read ${file.name}`);
    reader.readAsText(file, "UTF-8");
  }

  function populateProbandSelect() {
    el.probandSelect.innerHTML = "";
    if (!state.data || state.data.individuals.size === 0) {
      el.probandSelect.disabled = true;
      el.probandSelect.append(new Option("No proband candidates found", ""));
      state.probandId = "";
      return;
    }

    const people = Array.from(state.data.individuals.values()).sort((a, b) => {
      const nameCompare = a.name.display.localeCompare(b.name.display);
      return nameCompare || a.id.localeCompare(b.id);
    });

    for (const person of people) {
      el.probandSelect.append(new Option(`${person.name.display} (${person.id})`, individualProbandValue(person.id)));
    }

    const normalizedSelection = normalizeProbandSelection(state.probandId);
    state.probandId = normalizedSelection || individualProbandValue(people[0].id);
    el.probandSelect.value = state.probandId;
    el.probandSelect.disabled = false;
  }

  function individualProbandValue(id) {
    return `INDI:${id}`;
  }

  function parseProbandValue(value) {
    const raw = String(value || "");
    const match = raw.match(/^INDI:(.*)$/);
    if (match) return { type: "INDI", id: match[1] };
    return { type: "INDI", id: raw };
  }

  function normalizeProbandSelection(value) {
    if (!state.data || !value) return "";
    const parsed = parseProbandValue(value);
    if (parsed.type === "INDI" && state.data.individuals.has(parsed.id)) {
      return individualProbandValue(parsed.id);
    }
    return "";
  }

  function selectedIndividualProbandId() {
    if (!state.data) return "";
    const parsed = parseProbandValue(state.probandId);
    if (parsed.type === "INDI") {
      return state.data.individuals.has(parsed.id) ? parsed.id : "";
    }
    return "";
  }

  function selectedProbandLabel() {
    if (!state.data) return "";
    const parsed = parseProbandValue(state.probandId);
    if (parsed.type === "INDI") {
      const person = state.data.individuals.get(parsed.id);
      return person ? person.name.display : "";
    }
    return "";
  }

  function updateFilters() {
    state.filters.birth = el.filterBirth.checked;
    state.filters.marriage = el.filterMarriage.checked;
    state.filters.death = el.filterDeath.checked;
    recalculate(false);
  }

  function recalculate(shouldFit) {
    if (!state.data) {
      state.visibleEvents = [];
      state.groups = [];
      renderAll();
      return;
    }

    const probandIndividualId = selectedIndividualProbandId();
    const result = Core.extractEvents(state.data, {
      ...state.filters,
      ancestryOnly: state.ancestryOnly && Boolean(probandIndividualId),
      probandId: probandIndividualId,
    });
    state.visibleEvents = result.events;
    state.groups = Core.groupEventsByLocation(state.visibleEvents, state.locations);

    if (state.selectedPlace && !state.groups.some((group) => group.place === state.selectedPlace)) {
      state.selectedPlace = "";
    }

    renderAll();
    if (shouldFit) fitToMarkers();
  }

  function renderAll() {
    renderStatus();
    renderSummary();
    renderColorLegend();
    renderPlaceList();
    renderSidebar();
    renderMap();
  }

  function renderStatus() {
    if (!state.data) {
      showStatus("No GEDCOM loaded");
      return;
    }
    const label = selectedProbandLabel();
    const suffix = label ? ` · proband: ${label}` : "";
    showStatus(`${state.fileName || "GEDCOM"} · ${state.data.individuals.size} people${suffix}`);
  }

  function showStatus(message) {
    el.statusLine.textContent = message;
  }

  function renderSummary() {
    const mapped = eventCountForGroups(state.groups.filter((group) => group.coordinates));
    const unmapped = state.visibleEvents.length - mapped;
    const unmappedPlaces = state.groups.filter((group) => !group.coordinates);
    el.peopleCount.textContent = peopleCountForEvents(state.visibleEvents).toLocaleString();
    el.eventCount.textContent = state.visibleEvents.length.toLocaleString();
    el.mappedCount.textContent = mapped.toLocaleString();
    el.unmappedCount.textContent = unmapped.toLocaleString();
    el.eventBreakdown.textContent = eventBreakdownText(state.visibleEvents);
    el.missingLocationNotice.classList.toggle("hidden", !unmappedPlaces.length);
    el.missingLocationNotice.textContent = unmappedPlaces.length
      ? `${unmappedPlaces.length.toLocaleString()} GEDCOM place name${unmappedPlaces.length === 1 ? " is" : "s are"} missing from the coordinate table. Check the Unmapped list below.`
      : "";
  }

  function eventCountForGroups(groups) {
    return groups.reduce((sum, group) => sum + group.events.length, 0);
  }

  function peopleCountForEvents(events) {
    const people = new Set();
    for (const event of events) {
      for (const personId of event.people || []) {
        if (personId) people.add(personId);
      }
    }
    return people.size;
  }

  function eventBreakdownText(events) {
    if (!events.length) return "";
    const counts = events.reduce(
      (total, event) => {
        total[event.type] = (total[event.type] || 0) + 1;
        return total;
      },
      { birth: 0, marriage: 0, death: 0 },
    );
    return `Births ${counts.birth.toLocaleString()} · Marriages ${counts.marriage.toLocaleString()} · Deaths ${counts.death.toLocaleString()}`;
  }

  function renderColorLegend() {
    if (state.colorMode === "single") {
      el.colorLegend.classList.add("hidden");
      return;
    }

    const context = Core.colorContext(state.visibleEvents, state.singleColor);
    const info = colorLegendInfo(state.colorMode, context);
    el.colorLegend.classList.remove("hidden");
    el.colorLegendTitle.textContent = info.title;
    el.colorLegendRamp.style.background = `linear-gradient(90deg, ${context.palette.join(", ")})`;
    el.colorLegendRamp.classList.toggle("is-muted", !info.usable);
    el.colorLegendMin.textContent = info.minLabel;
    el.colorLegendMax.textContent = info.maxLabel;
    el.colorLegendNote.textContent = info.note;
  }

  function colorLegendInfo(mode, context) {
    if (mode === "time") {
      const same = context.dateCount > 0 && context.minDate === context.maxDate;
      return {
        title: "Event time",
        minLabel: context.minDateLabel || "No date",
        maxLabel: context.maxDateLabel || "No date",
        usable: context.dateCount > 0,
        note: context.dateCount
          ? same
            ? "All dated events share the same date."
            : `${context.dateCount} of ${context.totalEvents} events have dates; location markers use the latest dated event there.`
          : "No dated events are available in the current filter.",
      };
    }

    if (mode === "lineageX") {
      const same = context.lineageXCount > 0 && context.minLineageX === context.maxLineageX;
      return {
        title: "Lineage position",
        minLabel: "Paternal side",
        maxLabel: "Maternal side",
        usable: context.lineageXCount > 0,
        note: context.lineageXCount
          ? same
            ? "All scored events have the same lineage position."
            : `${context.lineageXCount} of ${context.totalEvents} events have lineage positions; location markers average events at that place.`
          : lineageUnavailableNote(),
      };
    }

    const same = context.lineageDepthCount > 0 && context.minDepth === context.maxDepth;
    return {
      title: "Generation depth",
      minLabel: context.lineageDepthCount ? generationLabel(context.minDepth) : "No generation",
      maxLabel: context.lineageDepthCount ? generationLabel(context.maxDepth) : "No generation",
      usable: context.lineageDepthCount > 0,
      note: context.lineageDepthCount
        ? same
          ? `All scored events are ${generationLabel(context.minDepth).toLowerCase()}.`
          : `${context.lineageDepthCount} of ${context.totalEvents} events have generation depths; lower numbers are closer to the proband.`
        : lineageUnavailableNote(),
    };
  }

  function lineageUnavailableNote() {
    return state.data
      ? "No lineage data is available for the current proband and filters."
      : "Load a GEDCOM to compute lineage colors.";
  }

  function generationLabel(depth) {
    return Number(depth) === 0 ? "Generation 0 (proband)" : `Generation ${Number(depth).toLocaleString()}`;
  }

  function renderPlaceList() {
    el.placeList.innerHTML = "";
    const targetMapped = state.placeListMode === "mapped";
    const rows = state.groups
      .filter((group) => Boolean(group.coordinates) === targetMapped)
      .sort((a, b) => b.events.length - a.events.length || a.place.localeCompare(b.place));

    if (!rows.length) {
      const empty = document.createElement("div");
      empty.className = "subtle";
      empty.textContent = targetMapped ? "No mapped locations" : "No unmapped locations";
      el.placeList.append(empty);
      return;
    }

    for (const group of rows) {
      el.placeList.append(renderPlaceRow(group, targetMapped));
    }
  }

  function renderPlaceRow(group, isMapped) {
    const row = document.createElement("div");
    row.className = "place-row";

    const header = document.createElement("header");
    const title = document.createElement("strong");
    title.textContent = group.place;
    const count = document.createElement("span");
    count.className = "badge";
    count.textContent = `${group.events.length} event${group.events.length === 1 ? "" : "s"}`;
    header.append(title, count);
    row.append(header);

    row.append(renderCoordinateEditor(group, isMapped));

    if (isMapped) {
      const actions = document.createElement("div");
      actions.className = "button-row";
      const select = document.createElement("button");
      select.type = "button";
      select.textContent = "Select";
      select.addEventListener("click", () => selectPlace(group.place));
      const remove = document.createElement("button");
      remove.type = "button";
      remove.textContent = "Remove";
      remove.addEventListener("click", () => removeCoordinate(group.place));
      actions.append(select, remove);
      row.append(actions);
    }

    return row;
  }

  function renderCoordinateEditor(group, isMapped) {
    const grid = document.createElement("form");
    grid.className = "coordinate-grid";
    const lat = document.createElement("input");
    lat.type = "number";
    lat.step = "any";
    lat.min = "-90";
    lat.max = "90";
    lat.required = true;
    lat.setAttribute("aria-label", `Latitude for ${group.place}`);
    lat.placeholder = "Latitude";
    lat.value = group.coordinates ? group.coordinates.lat : "";
    const lng = document.createElement("input");
    lng.type = "number";
    lng.step = "any";
    lng.min = "-180";
    lng.max = "180";
    lng.required = true;
    lng.setAttribute("aria-label", `Longitude for ${group.place}`);
    lng.placeholder = "Longitude";
    lng.value = group.coordinates ? group.coordinates.lng : "";
    const save = document.createElement("button");
    save.type = "submit";
    save.textContent = isMapped ? "Update" : "Save";
    grid.addEventListener("submit", (event) => {
      event.preventDefault();
      saveCoordinate(group.place, lat.value, lng.value);
    });
    const latLabel = document.createElement("label");
    latLabel.textContent = "Latitude";
    latLabel.append(lat);
    const lngLabel = document.createElement("label");
    lngLabel.textContent = "Longitude";
    lngLabel.append(lng);
    grid.append(latLabel, lngLabel, save);
    return grid;
  }

  function saveCoordinate(place, latValue, lngValue) {
    const lat = Number(latValue);
    const lng = Number(lngValue);
    if (!String(latValue).trim() || !String(lngValue).trim() || !Number.isFinite(lat) || lat < -90 || lat > 90 || !Number.isFinite(lng) || lng < -180 || lng > 180) {
      showStatus("Coordinates must be valid latitude and longitude values");
      return;
    }
    state.locations[place] = { lat, lng };
    saveStoredLocations(state.locations);
    recalculate(false);
  }

  function removeCoordinate(place) {
    delete state.locations[place];
    saveStoredLocations(state.locations);
    recalculate(true);
  }

  function clearLocations() {
    if (!Object.keys(state.locations).length) return;
    if (!window.confirm("Clear all saved coordinates from this browser?")) return;
    state.locations = {};
    saveStoredLocations(state.locations);
    recalculate(true);
  }

  function renderSidebar() {
    const group = state.groups.find((item) => item.place === state.selectedPlace) || null;
    el.eventList.innerHTML = "";
    el.selectedCoordinates.innerHTML = "";

    if (!group) {
      el.selectedPlaceTitle.textContent = "No location selected";
      el.selectedPlaceMeta.textContent = "Click a marker on the map";
      return;
    }

    el.selectedPlaceTitle.textContent = group.place;
    el.selectedPlaceMeta.textContent = `${group.events.length} event${group.events.length === 1 ? "" : "s"}`;
    el.selectedCoordinates.append(renderCoordinateEditor(group, Boolean(group.coordinates)));
    const sortedEvents = [...group.events].sort((a, b) => {
      const dateA = a.date && a.date.comparable != null ? a.date.comparable : Number.POSITIVE_INFINITY;
      const dateB = b.date && b.date.comparable != null ? b.date.comparable : Number.POSITIVE_INFINITY;
      return dateA - dateB || a.name.localeCompare(b.name);
    });

    for (const event of sortedEvents) {
      const row = document.createElement("div");
      row.className = "event-row";
      const name = document.createElement("strong");
      name.textContent = event.name;
      const meta = document.createElement("div");
      meta.className = "event-meta";
      const eventLine = document.createElement("span");
      eventLine.textContent = `${event.label} · ${event.dateLabel || "No date"}`;
      const relationLine = document.createElement("span");
      relationLine.textContent = event.relation ? `Relation to proband: ${event.relation}` : "Relation to proband: not in ancestry";
      const placeLine = document.createElement("span");
      placeLine.textContent = event.place;
      meta.append(eventLine, relationLine, placeLine);
      row.append(name, meta);
      el.eventList.append(row);
    }
  }

  function renderMap() {
    const rect = el.mapViewport.getBoundingClientRect();
    const width = Math.max(1, Math.round(rect.width));
    const height = Math.max(1, Math.round(rect.height));
    el.offlineLayer.setAttribute("width", String(width));
    el.offlineLayer.setAttribute("height", String(height));
    el.offlineLayer.setAttribute("viewBox", `0 0 ${width} ${height}`);
    el.markerLayer.setAttribute("width", String(width));
    el.markerLayer.setAttribute("height", String(height));
    el.markerLayer.setAttribute("viewBox", `0 0 ${width} ${height}`);

    drawOfflineLayer(width, height);
    renderMarkers(width, height);
  }

  function drawOfflineLayer(width, height) {
    const parts = [];
    parts.push(`<rect x="0" y="0" width="${width}" height="${height}" fill="#cfe3ee"></rect>`);
    drawBasemap(parts, width, height);

    const longitudeStep = gridStepForZoom(state.view.zoom);
    const latitudeStep = longitudeStep;
    const bounds = screenBounds(width, height);

    for (let lng = Math.floor(bounds.minLng / longitudeStep) * longitudeStep; lng <= bounds.maxLng; lng += longitudeStep) {
      const a = latLngToScreen(clampLat(bounds.minLat), lng, width, height);
      const b = latLngToScreen(clampLat(bounds.maxLat), lng, width, height);
      parts.push(`<line class="map-grid" x1="${a.x.toFixed(1)}" y1="${a.y.toFixed(1)}" x2="${b.x.toFixed(1)}" y2="${b.y.toFixed(1)}"></line>`);
      if (a.x > 24 && a.x < width - 24) {
        parts.push(`<text class="map-label" x="${a.x.toFixed(1)}" y="18" text-anchor="middle">${formatLng(lng)}</text>`);
      }
    }

    for (let lat = Math.floor(bounds.minLat / latitudeStep) * latitudeStep; lat <= bounds.maxLat; lat += latitudeStep) {
      const a = latLngToScreen(lat, bounds.minLng, width, height);
      const b = latLngToScreen(lat, bounds.maxLng, width, height);
      parts.push(`<line class="map-grid" x1="${a.x.toFixed(1)}" y1="${a.y.toFixed(1)}" x2="${b.x.toFixed(1)}" y2="${b.y.toFixed(1)}"></line>`);
      if (a.y > 18 && a.y < height - 12) {
        parts.push(`<text class="map-label" x="8" y="${(a.y - 4).toFixed(1)}">${formatLat(lat)}</text>`);
      }
    }

    drawMapLabels(parts, width, height, bounds);
    el.offlineLayer.innerHTML = parts.join("");
  }

  function drawBasemap(parts, width, height) {
    if (!state.basemap) return;
    const bounds = paddedScreenBounds(width, height);
    const detailRegions = visibleDetailRegions(bounds);

    if (!detailRegions.length) {
      return;
    }

    for (const region of detailRegions) {
      const level = detailLevelForRegion(region);
      const detailLand = pathForPolygons(level.countries, width, height, bounds, { split: false, close: true });
      const detailWater = pathForPolygons(level.water, width, height, bounds, { split: false, close: true });
      const detailBorders = pathForPolygons(level.countries, width, height, bounds, { split: true, close: false });
      const provinceBorders = pathForPolygons(level.provinces, width, height, bounds, { split: true, close: false });
      if (detailLand) parts.push(`<path class="map-detail-land" d="${detailLand}"></path>`);
      if (detailWater) parts.push(`<path class="map-detail-water" d="${detailWater}"></path>`);
      if (detailBorders) {
        parts.push(`<path class="map-detail-border" d="${detailBorders}"></path>`);
      }
      if (provinceBorders) {
        parts.push(`<path class="map-province-border" d="${provinceBorders}"></path>`);
      }
    }
  }

  function pathForPolygons(polygons, width, height, bounds, options) {
    const settings = {
      split: false,
      close: true,
      ...options,
    };
    const pathParts = [];
    const splitDistance = Math.max(width * 0.55, 360);
    const minPointDistance = pointDistanceForZoom(state.view.zoom);
    for (const polygon of polygons) {
      if (!bboxIntersects(polygon.bbox, bounds)) continue;
      for (const ring of polygon.rings) {
        let open = false;
        let previous = null;
        let lastWritten = null;
        for (let index = 0; index < ring.length; index += 1) {
          const coordinate = ring[index];
          const point = latLngToScreen(coordinate[1], coordinate[0], width, height);
          const isLast = index === ring.length - 1;
          const shouldSkip =
            !isLast &&
            lastWritten &&
            Math.abs(point.x - lastWritten.x) < minPointDistance &&
            Math.abs(point.y - lastWritten.y) < minPointDistance;
          if (shouldSkip) continue;

          const shouldSplit =
            previous &&
            (Math.abs(point.x - previous.x) > splitDistance || Math.abs(point.y - previous.y) > height * 0.9);

          if (!previous || shouldSplit) {
            if (shouldSplit && open && settings.close) pathParts.push("Z");
            pathParts.push(`M${point.x.toFixed(1)},${point.y.toFixed(1)}`);
            open = true;
          } else {
            pathParts.push(`L${point.x.toFixed(1)},${point.y.toFixed(1)}`);
          }
          previous = point;
          lastWritten = point;
        }
        if (open && settings.close && !settings.split) pathParts.push("Z");
      }
    }
    return pathParts.join("");
  }

  function paddedScreenBounds(width, height) {
    const bounds = screenBounds(width, height);
    const latPad = Math.max(2, (bounds.maxLat - bounds.minLat) * 0.15);
    const lngPad = Math.max(2, (bounds.maxLng - bounds.minLng) * 0.15);
    return {
      minLat: Math.max(-90, bounds.minLat - latPad),
      maxLat: Math.min(90, bounds.maxLat + latPad),
      minLng: bounds.minLng - lngPad,
      maxLng: bounds.maxLng + lngPad,
    };
  }

  function bboxIntersects(bbox, bounds) {
    if (!bbox || !bounds) return true;
    if (bounds.maxLng - bounds.minLng >= 320) return true;
    return bbox.maxLat >= bounds.minLat && bbox.minLat <= bounds.maxLat && bbox.maxLng >= bounds.minLng && bbox.minLng <= bounds.maxLng;
  }

  function pointDistanceForZoom(zoom) {
    if (zoom < 3) return 1.1;
    if (zoom < 5) return 0.8;
    if (zoom < 7) return 0.45;
    if (zoom < 9) return 0.2;
    return 0.08;
  }

  function visibleDetailRegions(bounds) {
    if (!state.basemap) return [];
    return state.basemap.regions.filter((region) => bboxIntersects(region.bbox, bounds));
  }

  function detailLevelForRegion(region) {
    const levels = region.levels && region.levels.length ? region.levels : [{ minZoom: 4.4, countries: region.countries || [] }];
    let selected = levels[0];
    for (const level of levels) {
      if (state.view.zoom >= level.minZoom) selected = level;
    }
    return selected;
  }

  function drawMapLabels(parts, width, height, bounds) {
    const placed = [];
    const visibleLabels = [];
    for (const region of visibleDetailRegions(bounds)) {
      for (const label of region.labels || []) {
        if (state.view.zoom < label.minZoom) continue;
        if (label.lat < bounds.minLat || label.lat > bounds.maxLat || label.lng < bounds.minLng || label.lng > bounds.maxLng) continue;
        visibleLabels.push(label);
      }
    }

    visibleLabels.sort((a, b) => (a.rank || 9) - (b.rank || 9) || a.minZoom - b.minZoom || a.name.localeCompare(b.name));

    for (const label of visibleLabels) {
      const point = latLngToScreen(label.lat, label.lng, width, height);
      const labelBounds = cityLabelBounds(label.name, point);
      if (point.x < -20 || point.x > width + 20 || point.y < -20 || point.y > height + 20) continue;
      if (placed.some((item) => rectsOverlap(item, labelBounds))) continue;
      placed.push(labelBounds);
      parts.push(`<circle class="map-city-dot" cx="${point.x.toFixed(1)}" cy="${point.y.toFixed(1)}" r="2.1"></circle>`);
      parts.push(`<text class="map-city-label" x="${(point.x + 5).toFixed(1)}" y="${(point.y - 5).toFixed(1)}">${escapeSvg(label.name)}</text>`);
    }
  }

  function cityLabelBounds(name, point) {
    const textWidth = Math.max(28, String(name).length * 6.4);
    return {
      left: point.x - 4,
      right: point.x + textWidth + 10,
      top: point.y - 18,
      bottom: point.y + 5,
    };
  }

  function rectsOverlap(a, b) {
    return a.left <= b.right && a.right >= b.left && a.top <= b.bottom && a.bottom >= b.top;
  }

  function escapeSvg(value) {
    return String(value)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  function renderMarkers(width, height) {
    el.markerLayer.innerHTML = "";
    const mappedGroups = state.groups.filter((group) => group.coordinates);
    el.mapEmpty.classList.toggle("hidden", mappedGroups.length > 0);
    const context = Core.colorContext(state.visibleEvents, state.singleColor);

    for (const group of mappedGroups) {
      const point = latLngToScreen(group.coordinates.lat, group.coordinates.lng, width, height);
      if (point.x < -50 || point.x > width + 50 || point.y < -50 || point.y > height + 50) continue;

      const marker = document.createElementNS("http://www.w3.org/2000/svg", "g");
      marker.classList.add("marker");
      if (group.place === state.selectedPlace) marker.classList.add("is-selected");
      marker.setAttribute("transform", `translate(${point.x.toFixed(1)} ${point.y.toFixed(1)})`);
      marker.setAttribute("tabindex", "0");
      marker.setAttribute("role", "button");
      marker.setAttribute("aria-label", `${group.place}, ${group.events.length} events`);

      const radius = Math.max(15, Math.min(30, 12 + Math.sqrt(group.events.length) * 4));
      const circle = document.createElementNS("http://www.w3.org/2000/svg", "circle");
      circle.setAttribute("r", String(radius));
      circle.setAttribute("fill", Core.colorForGroup(group, state.colorMode, context));
      const text = document.createElementNS("http://www.w3.org/2000/svg", "text");
      text.textContent = String(group.events.length);
      const title = document.createElementNS("http://www.w3.org/2000/svg", "title");
      title.textContent = `${group.place}: ${group.events.length} event${group.events.length === 1 ? "" : "s"}`;

      marker.append(title, circle, text);
      marker.addEventListener("click", () => selectPlace(group.place));
      marker.addEventListener("mouseenter", () => selectPlace(group.place));
      marker.addEventListener("keydown", (event) => {
        if (event.key === "Enter" || event.key === " ") {
          event.preventDefault();
          selectPlace(group.place);
        }
      });
      el.markerLayer.append(marker);
    }
  }

  function selectPlace(place) {
    state.selectedPlace = place;
    renderSidebar();
    renderMap();
  }

  function fitToMarkers() {
    const mapped = state.groups.filter((group) => group.coordinates);
    if (!mapped.length) {
      state.view = { ...DEFAULT_VIEW };
      renderMap();
      return;
    }

    const rect = el.mapViewport.getBoundingClientRect();
    const width = Math.max(320, rect.width);
    const height = Math.max(240, rect.height);
    const lats = mapped.map((group) => Number(group.coordinates.lat));
    const lngs = mapped.map((group) => Number(group.coordinates.lng));
    const minLat = Math.min(...lats);
    const maxLat = Math.max(...lats);
    const minLng = Math.min(...lngs);
    const maxLng = Math.max(...lngs);
    const centerLat = (minLat + maxLat) / 2;
    const centerLng = (minLng + maxLng) / 2;
    let bestZoom = MIN_ZOOM;

    for (let zoom = 15; zoom >= MIN_ZOOM; zoom -= 0.25) {
      const a = project(maxLat, minLng, zoom);
      const b = project(minLat, maxLng, zoom);
      if (Math.abs(b.x - a.x) <= width - 90 && Math.abs(b.y - a.y) <= height - 90) {
        bestZoom = zoom;
        break;
      }
    }

    state.view = {
      centerLat: clampLat(centerLat),
      centerLng: wrapLng(centerLng),
      zoom: clamp(bestZoom, MIN_ZOOM, 15),
    };
    renderMap();
  }

  function zoomBy(delta) {
    const rect = el.mapViewport.getBoundingClientRect();
    zoomAt(rect.width / 2, rect.height / 2, state.view.zoom + delta);
  }

  function onWheel(event) {
    event.preventDefault();
    const rect = el.mapViewport.getBoundingClientRect();
    const delta = event.deltaY > 0 ? -0.5 : 0.5;
    zoomAt(event.clientX - rect.left, event.clientY - rect.top, state.view.zoom + delta);
  }

  function zoomAt(screenX, screenY, nextZoom) {
    const rect = el.mapViewport.getBoundingClientRect();
    const width = Math.max(1, rect.width);
    const height = Math.max(1, rect.height);
    const before = screenToLatLng(screenX, screenY, width, height);
    state.view.zoom = clamp(nextZoom, MIN_ZOOM, MAX_ZOOM);
    const beforePoint = project(before.lat, before.lng, state.view.zoom);
    const centerPoint = {
      x: beforePoint.x - (screenX - width / 2),
      y: beforePoint.y - (screenY - height / 2),
    };
    const center = unproject(centerPoint.x, centerPoint.y, state.view.zoom);
    state.view.centerLat = center.lat;
    state.view.centerLng = center.lng;
    renderMap();
  }

  function onPointerDown(event) {
    if (event.target.closest(".marker")) return;
    el.mapViewport.setPointerCapture(event.pointerId);
    state.dragging = {
      pointerId: event.pointerId,
      x: event.clientX,
      y: event.clientY,
      center: project(state.view.centerLat, state.view.centerLng, state.view.zoom),
    };
  }

  function onPointerMove(event) {
    if (!state.dragging || state.dragging.pointerId !== event.pointerId) return;
    const dx = event.clientX - state.dragging.x;
    const dy = event.clientY - state.dragging.y;
    const center = unproject(state.dragging.center.x - dx, state.dragging.center.y - dy, state.view.zoom);
    state.view.centerLat = center.lat;
    state.view.centerLng = center.lng;
    renderMap();
  }

  function onPointerUp(event) {
    if (state.dragging && state.dragging.pointerId === event.pointerId) {
      state.dragging = null;
    }
  }

  function latLngToScreen(lat, lng, width, height) {
    const center = project(state.view.centerLat, state.view.centerLng, state.view.zoom);
    const point = project(lat, lng, state.view.zoom);
    let dx = point.x - center.x;
    const world = TILE_SIZE * Math.pow(2, state.view.zoom);
    if (dx > world / 2) dx -= world;
    if (dx < -world / 2) dx += world;
    return {
      x: width / 2 + dx,
      y: height / 2 + point.y - center.y,
    };
  }

  function screenToLatLng(x, y, width, height) {
    const center = project(state.view.centerLat, state.view.centerLng, state.view.zoom);
    return unproject(center.x + x - width / 2, center.y + y - height / 2, state.view.zoom);
  }

  function screenBounds(width, height) {
    const corners = [
      screenToLatLng(0, 0, width, height),
      screenToLatLng(width, 0, width, height),
      screenToLatLng(width, height, width, height),
      screenToLatLng(0, height, width, height),
    ];
    return {
      minLat: Math.max(-85, Math.min(...corners.map((corner) => corner.lat))),
      maxLat: Math.min(85, Math.max(...corners.map((corner) => corner.lat))),
      minLng: Math.min(...corners.map((corner) => corner.lng)),
      maxLng: Math.max(...corners.map((corner) => corner.lng)),
    };
  }

  function project(lat, lng, zoom) {
    const scale = TILE_SIZE * Math.pow(2, zoom);
    const clampedLat = clampLat(lat);
    const sin = Math.sin((clampedLat * Math.PI) / 180);
    return {
      x: ((wrapLng(lng) + 180) / 360) * scale,
      y: (0.5 - Math.log((1 + sin) / (1 - sin)) / (4 * Math.PI)) * scale,
    };
  }

  function unproject(x, y, zoom) {
    const scale = TILE_SIZE * Math.pow(2, zoom);
    const lng = (x / scale) * 360 - 180;
    const n = Math.PI - (2 * Math.PI * y) / scale;
    const lat = (180 / Math.PI) * Math.atan(0.5 * (Math.exp(n) - Math.exp(-n)));
    return {
      lat: clampLat(lat),
      lng: wrapLng(lng),
    };
  }

  function parseLocationImport(text, fileName) {
    const trimmed = text.trim();
    if (!trimmed) return {};
    if (fileName.toLowerCase().endsWith(".json") || trimmed.startsWith("{") || trimmed.startsWith("[")) {
      return normalizeLocationTable(JSON.parse(trimmed));
    }
    return parseLocationCsv(trimmed);
  }

  function normalizeLocationTable(value) {
    const output = {};
    if (Array.isArray(value)) {
      for (const row of value) {
        const place = String(row.place || row.location || row.name || "").trim();
        if (!place) continue;
        const coordinate = coordinateFrom(row);
        if (coordinate) output[place] = coordinate;
      }
      return output;
    }

    for (const [place, coordinateValue] of Object.entries(value || {})) {
      const coordinate = Array.isArray(coordinateValue)
        ? coordinateFrom({ lat: coordinateValue[0], lng: coordinateValue[1] })
        : coordinateFrom(coordinateValue);
      if (place.trim() && coordinate) output[place.trim()] = coordinate;
    }
    return output;
  }

  function parseLocationCsv(text) {
    const rows = text.split(/\r?\n/).map(parseCsvLine).filter((row) => row.length);
    if (!rows.length) return {};
    const header = rows[0].map((cell) => cell.toLowerCase().trim());
    const hasHeader = header.includes("lat") || header.includes("latitude");
    const placeIndex = hasHeader ? firstIndex(header, ["place", "location", "name"]) : 0;
    const latIndex = hasHeader ? firstIndex(header, ["lat", "latitude"]) : 1;
    const lngIndex = hasHeader ? firstIndex(header, ["lng", "lon", "long", "longitude"]) : 2;
    const dataRows = hasHeader ? rows.slice(1) : rows;
    const output = {};

    for (const row of dataRows) {
      const place = String(row[placeIndex] || "").trim();
      const coordinate = coordinateFrom({ lat: row[latIndex], lng: row[lngIndex] });
      if (place && coordinate) output[place] = coordinate;
    }
    return output;
  }

  function parseCsvLine(line) {
    const cells = [];
    let current = "";
    let quoted = false;
    for (let i = 0; i < line.length; i += 1) {
      const char = line[i];
      if (char === '"' && line[i + 1] === '"') {
        current += '"';
        i += 1;
      } else if (char === '"') {
        quoted = !quoted;
      } else if (char === "," && !quoted) {
        cells.push(current.trim());
        current = "";
      } else {
        current += char;
      }
    }
    cells.push(current.trim());
    return cells;
  }

  function coordinateFrom(value) {
    const source = value || {};
    const lat = Number(source.lat != null ? source.lat : source.latitude);
    let rawLng = source.lng;
    if (rawLng == null) rawLng = source.lon;
    if (rawLng == null) rawLng = source.long;
    if (rawLng == null) rawLng = source.longitude;
    const lng = Number(rawLng);
    if (source.lat == null && source.latitude == null) return null;
    if (rawLng == null || !Number.isFinite(lat) || lat < -90 || lat > 90) return null;
    if (!Number.isFinite(lng) || lng < -180 || lng > 180) return null;
    return { lat, lng };
  }

  function firstIndex(header, names) {
    for (const name of names) {
      const index = header.indexOf(name);
      if (index !== -1) return index;
    }
    return 0;
  }

  function exportLocations() {
    const blob = new Blob([JSON.stringify(state.locations, null, 2) + "\n"], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const link = document.createElement("a");
    link.href = url;
    link.download = "gedver-locations.local.json";
    link.click();
    URL.revokeObjectURL(url);
  }

  function loadStoredLocations() {
    try {
      return normalizeLocationTable(JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}"));
    } catch {
      return {};
    }
  }

  function saveStoredLocations(locations) {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(locations));
    } catch {
      showStatus("Coordinates are active for this session but could not be saved");
    }
  }

  function buildMapData(mapData) {
    if (!mapData || !Array.isArray(mapData.regions) || !mapData.regions.length) return null;
    return {
      regions: (mapData.regions || []).map((region) => ({
        name: region.name,
        bbox: region.bbox,
        countries: region.countries || [],
        levels: mapRegionLevels(region),
        labels: region.labels || [],
      })),
    };
  }

  function mapRegionLevels(region) {
    if (Array.isArray(region.levels) && region.levels.length) {
      return region.levels
        .map((level) => ({
          id: level.id || "detail",
          minZoom: Number(level.minZoom) || 4.4,
          countries: level.countries || [],
          provinces: level.provinces || [],
          water: level.water || [],
        }))
        .sort((a, b) => a.minZoom - b.minZoom);
    }

    return [{ id: "legacy", minZoom: 4.4, countries: region.countries || [], provinces: [], water: [] }];
  }

  function gridStepForZoom(zoom) {
    if (zoom < 2) return 60;
    if (zoom < 3) return 30;
    if (zoom < 5) return 10;
    if (zoom < 7) return 5;
    if (zoom < 9) return 1;
    if (zoom < 12) return 0.25;
    return 0.1;
  }

  function formatLat(lat) {
    const suffix = lat < 0 ? "S" : "N";
    return `${Math.abs(lat).toFixed(Math.abs(lat) < 1 ? 1 : 0)}°${suffix}`;
  }

  function formatLng(lng) {
    const suffix = lng < 0 ? "W" : "E";
    return `${Math.abs(lng).toFixed(Math.abs(lng) < 1 ? 1 : 0)}°${suffix}`;
  }

  function clampLat(lat) {
    return clamp(Number(lat), -85.05112878, 85.05112878);
  }

  function wrapLng(lng) {
    const wrapped = ((((Number(lng) + 180) % 360) + 360) % 360) - 180;
    return wrapped === -180 ? 180 : wrapped;
  }

  function clamp(value, min, max) {
    return Math.min(max, Math.max(min, Number(value)));
  }

  function debounce(fn, delay) {
    let timer = 0;
    return (...args) => {
      window.clearTimeout(timer);
      timer = window.setTimeout(() => fn(...args), delay);
    };
  }

  init();
})();
    </script>
  </body>
</html>
